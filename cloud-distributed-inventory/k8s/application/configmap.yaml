apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: cloud-inventory
data:
  PORT: "5000"
  NODE_ENV: "production"
  REPLICA_SET_NAME: "rs0"
  MONGODB_URI: "mongodb://mongo-0.mongo-headless.cloud-inventory.svc.cluster.local:27017,mongo-1.mongo-headless.cloud-inventory.svc.cluster.local:27017,mongo-2.mongo-headless.cloud-inventory.svc.cluster.local:27017/distributed_inventory?replicaSet=rs0"
  FRONTEND_URL: "http://frontend-service:80"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: cloud-inventory
type: Opaque
stringData:
  JWT_SECRET: "k8s-cloud-distributed-inventory-secure-secret-2026"
