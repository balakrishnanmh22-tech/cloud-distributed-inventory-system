# MongoDB Sharded Cluster Architecture for Large-Scale Distributed Inventory
# Components:
# 1. Config Server Replica Set (Stores cluster metadata & chunk mappings)
# 2. Shard 1 (Hosts partition chunk ranges)
# 3. Shard 2 (Hosts partition chunk ranges)
# 4. mongos Query Router (Stateless routing layer)

apiVersion: v1
kind: Service
metadata:
  name: mongos-service
  namespace: cloud-inventory
spec:
  type: ClusterIP
  selector:
    app: mongos
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
---
# mongos Query Router Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongos-router
  namespace: cloud-inventory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mongos
  template:
    metadata:
      labels:
        app: mongos
    spec:
      containers:
        - name: mongos
          image: mongo:7.0
          command:
            - "mongos"
            - "--configdb"
            - "cfg-rs/configsvr-0.configsvr-service.cloud-inventory.svc.cluster.local:27017"
            - "--bind_ip_all"
            - "--port"
            - "27017"
          ports:
            - containerPort: 27017
---
# Config Server StatefulSet (Metadata Store)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: configsvr
  namespace: cloud-inventory
spec:
  serviceName: configsvr-service
  replicas: 1
  selector:
    matchLabels:
      app: configsvr
  template:
    metadata:
      labels:
        app: configsvr
    spec:
      containers:
        - name: configsvr
          image: mongo:7.0
          command:
            - "mongod"
            - "--configsvr"
            - "--replSet"
            - "cfg-rs"
            - "--bind_ip_all"
            - "--port"
            - "27017"
          ports:
            - containerPort: 27017
---
# Shard 1 StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shard1
  namespace: cloud-inventory
spec:
  serviceName: shard1-service
  replicas: 1
  selector:
    matchLabels:
      app: shard1
  template:
    metadata:
      labels:
        app: shard1
    spec:
      containers:
        - name: shard1
          image: mongo:7.0
          command:
            - "mongod"
            - "--shardsvr"
            - "--replSet"
            - "shard1-rs"
            - "--bind_ip_all"
            - "--port"
            - "27017"
          ports:
            - containerPort: 27017
---
# Shard 2 StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shard2
  namespace: cloud-inventory
spec:
  serviceName: shard2-service
  replicas: 1
  selector:
    matchLabels:
      app: shard2
  template:
    metadata:
      labels:
        app: shard2
    spec:
      containers:
        - name: shard2
          image: mongo:7.0
          command:
            - "mongod"
            - "--shardsvr"
            - "--replSet"
            - "shard2-rs"
            - "--bind_ip_all"
            - "--port"
            - "27017"
          ports:
            - containerPort: 27017
