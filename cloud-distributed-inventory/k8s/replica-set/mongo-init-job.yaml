apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init-job
  namespace: cloud-inventory
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-init
          image: mongo:7.0
          command:
            - bash
            - -c
            - |
              echo "Waiting for MongoDB StatefulSet pods to be ready..."
              sleep 10
              mongosh --host mongo-0.mongo-headless.cloud-inventory.svc.cluster.local:27017 --eval '
                rs.initiate({
                  _id: "rs0",
                  members: [
                    { _id: 0, host: "mongo-0.mongo-headless.cloud-inventory.svc.cluster.local:27017", priority: 2 },
                    { _id: 1, host: "mongo-1.mongo-headless.cloud-inventory.svc.cluster.local:27017", priority: 1 },
                    { _id: 2, host: "mongo-2.mongo-headless.cloud-inventory.svc.cluster.local:27017", priority: 1 }
                  ]
                });
              ' || true
              echo "K8s Replica Set rs0 initialized."
